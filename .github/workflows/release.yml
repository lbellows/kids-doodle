name: Release APK

# Builds a signed universal APK and attaches it to a GitHub Release.
# IzzyOnDroid watches this repo's releases and picks the APK up automatically.
#
# The official F-Droid repo does not use this workflow — it builds from source
# with fdroid/com.kidsdoodle.app.yml and signs with its own key.
#
# Required repository secrets (see docs/PACKAGING.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Verify android/ matches app.json and the changelog exists
        run: npm run prebuild:check

      - name: Remove prebuilt binaries the Android build does not use
        run: npm run purge:blobs

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See docs/PACKAGING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          KIDSDOODLE_STORE_FILE: ${{ runner.temp }}/release.keystore
          KIDSDOODLE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KIDSDOODLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIDSDOODLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Confirm the APK is release-signed with the expected permissions
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          # Android identifies an app by package name + signing certificate, so
          # an APK signed with any other key is a different app to every device
          # that already has this one installed: users would have to uninstall
          # and reinstall to update. Pin the exact certificate rather than just
          # checking it is not the debug key.
          EXPECTED_CERT=a673f800d5c5d0eb63cf40cfa66253d0530bcf8a30fc866406c88cdd5e27ef31
          CERTS="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          echo "$CERTS"
          ACTUAL_CERT="$(echo "$CERTS" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::APK is signed with the wrong key."
            echo "Expected certificate SHA-256: $EXPECTED_CERT"
            echo "Actual certificate SHA-256:   ${ACTUAL_CERT:-(none)}"
            if echo "$CERTS" | grep -q "CN=Android Debug"; then
              echo "It is the public debug key: the ANDROID_* secrets did not"
              echo "reach Gradle. Check they are set on this repository."
            fi
            exit 1
          fi

          ACTUAL="$("$BUILD_TOOLS/aapt2" dump permissions "$APK" \
                    | sed -n "s/^uses-permission: name='\(.*\)'$/\1/p" | sort)"

          # VIBRATE is the only permission this app asks for (the wrong-PIN buzz).
          # DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION is generated by AndroidX core,
          # namespaced to our own package with protectionLevel="signature": it is
          # app-private, grants nothing to other apps, is not shown to users, and
          # removing it would break ContextCompat.registerReceiver.
          EXPECTED="$(printf '%s\n' \
            'android.permission.VIBRATE' \
            'com.kidsdoodle.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' | sort)"

          echo "Permissions in the release APK:"
          echo "${ACTUAL:-  (none)}"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Unexpected permission set in the release APK."
            echo "Expected:"; echo "$EXPECTED"
            echo "Actual:"; echo "${ACTUAL:-(none)}"
            echo "INTERNET or ACCESS_NETWORK_STATE here means"
            echo "plugins/withOfflineReleaseManifest.js did not apply."
            exit 1
          fi
          echo "OK — signed with the expected release key, no network permissions."

      - name: Name the APK after the release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "KidsDoodle-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: KidsDoodle-*.apk
          generate_release_notes: true
