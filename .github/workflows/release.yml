name: Release APKs

# Builds one signed APK per CPU architecture, proves the minified build actually
# runs, and attaches them to a GitHub Release, which is where the self-hosted
# F-Droid repo picks them up from. Running this by hand
# (workflow_dispatch) does everything except publish, which is the way to check
# a build before tagging.
#
# The official F-Droid repo does not use this workflow — it builds from source
# with fdroid/com.kidsdoodle.app.yml and signs with its own key.
#
# Required repository secrets (see docs/PACKAGING.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # The certificate this project publishes under. See docs/PACKAGING.md.
  RELEASE_CERT_SHA256: a673f800d5c5d0eb63cf40cfa66253d0530bcf8a30fc866406c88cdd5e27ef31

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Verify android/ matches app.json and the changelogs exist
        run: npm run prebuild:check

      - name: Remove prebuilt binaries the Android build does not use
        run: npm run purge:blobs

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See docs/PACKAGING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APKs
        env:
          KIDSDOODLE_STORE_FILE: ${{ runner.temp }}/release.keystore
          KIDSDOODLE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KIDSDOODLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIDSDOODLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the per-ABI APKs
        run: |
          ./scripts/check-release-apks.sh android/app/build/outputs/apk/release \
            --expect-cert "$RELEASE_CERT_SHA256"

      - name: Name the APKs after the release
        run: |
          VERSION="$(node -p "String(require('./app.json').expo.version)")"
          mkdir -p dist
          for APK in android/app/build/outputs/apk/release/*.apk; do
            ABI="$(basename "$APK" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$APK" "dist/KidsDoodle-${VERSION}-${ABI}.apk"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: error

  smoke-test:
    # R8 runs over release builds, and a missing keep rule only shows up at
    # runtime, so the APK is installed and the first screen checked before
    # anything is published.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: dist

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the x86_64 APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: ./scripts/smoke-test-apk.sh "$(ls dist/*-x86_64.apk)"

  publish:
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
