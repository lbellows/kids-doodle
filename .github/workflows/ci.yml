name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Types and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify android/ matches app.json and the changelog exists
        run: npm run prebuild:check

  android:
    name: Release APKs build
    runs-on: ubuntu-latest
    # A healthy build is ~25 min. Without a bound, a Gradle OOM thrashes until
    # GitHub's six-hour job limit kills it — which is exactly what happened once.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Remove prebuilt binaries the Android build does not use
        run: npm run purge:blobs

      # No keystore is configured here on purpose: withReleaseSigning falls back
      # to debug signing when there is none, which is exactly what F-Droid's
      # buildserver does. This job proves the source builds; release.yml proves
      # it signs.
      - name: Build release APKs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the per-ABI APKs
        run: ./scripts/check-release-apks.sh android/app/build/outputs/apk/release

      - name: Upload APKs for inspection
        uses: actions/upload-artifact@v4
        with:
          name: kidsdoodle-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
