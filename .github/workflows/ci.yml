name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Types and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify android/ matches app.json and the changelog exists
        run: npm run prebuild:check

  android:
    name: Release APKs build
    runs-on: ubuntu-latest
    # A healthy build is ~25 min. Without a bound, a Gradle OOM thrashes until
    # GitHub's six-hour job limit kills it — which is exactly what happened once.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - name: Remove prebuilt binaries the Android build does not use
        run: npm run purge:blobs

      # No keystore is configured here on purpose: withReleaseSigning falls back
      # to debug signing when there is none, so this job needs no secrets. It
      # proves the source builds; release.yml proves it signs.
      - name: Build release APKs
        working-directory: android
        # --build-cache reuses task outputs across runs. The cache lives in the
        # Gradle user home, which setup-gradle saves and restores, so it only
        # pays off from the second run onward. It is a CLI flag rather than
        # org.gradle.caching in android/gradle.properties because that file is
        # regenerated by expo prebuild.
        run: ./gradlew assembleRelease --no-daemon --build-cache

      - name: Verify the per-ABI APKs
        run: ./scripts/check-release-apks.sh android/app/build/outputs/apk/release

      - name: Upload APKs for inspection
        uses: actions/upload-artifact@v7
        with:
          name: kidsdoodle-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
