Builds:
  - versionName: 1.0.3
    versionCode: 41
    commit: v1.0.3
    subdir: android/app
    sudo:
      - curl -Lo node.tar.gz https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.gz
      - echo "b294a556e639d64338823920e5866c21c02741742d2e1529ee1a225c1ec9252a  node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --directory=/opt
      - rm -rf /opt/node
      - mv /opt/node-v22.23.2-linux-x64 /opt/node
      - ln -sf /opt/node/bin/node /opt/node/bin/npm /opt/node/bin/npx /usr/local/bin/
      - curl -Lo jdk17.tar.gz https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz
      - echo "3808d1d15e3ec6bd5b84057fb5d84c33d8a1536a258146bcea2e603fc726e08e  jdk17.tar.gz"
        | sha256sum -c -
      - mkdir -p /usr/lib/jvm
      - tar xzf jdk17.tar.gz --directory=/usr/lib/jvm
    init:
      - cd ../..
      - npm ci
      - ./scripts/purge-nonfree-blobs.sh
    gradle:
      - yes
    rm:
      - .github
    prebuild:
      - grep -q 'includeInApk = false' build.gradle && exit 0
      - sed -i '/compileSdk rootProject.ext.compileSdkVersion/a\    dependenciesInfo
        { includeInApk = false; includeInBundle = false }' build.gradle
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
    ndk: r27b
    gradleprops:
      - reactNativeArchitectures=armeabi-v7a
      - org.gradle.java.installations.paths=/usr/lib/jvm/jdk-17.0.20.1+1

