MaintainerNotes: |-
  Expo (React Native) app. The native android/ project is committed and
  regenerated with `npx expo prebuild`; CI fails the build if it drifts from
  app.json.

  android/gradle.properties already sets -Xmx4g -XX:MaxMetaspaceSize=1g, so
  this recipe does not need extra memory flags.

  Every release has three builds, one per ABI. VercodeOperation reproduces the
  versionCode scheme (`expo.android.versionCode * 10 + 1/2/3`), so the
  auto-updater copies all three entries on a new tag. Keep the build blocks in
  ascending-offset order.

  Release builds run R8 and store native libraries compressed. Keep rules are
  in android/app/proguard-rules.pro; upstream CI installs the minified APK on
  an emulator and fails the release if the app does not render.

  `gradle assembleRelease` produces a debug-signed APK here: the release
  signing config activates only when a keystore is supplied via environment
  variables. Only the public Android debug key is committed.

  Node is the official linux-x64 .tar.gz (the buildserver has no xz). The three
  ABI sudo blocks share a VM, so the install is idempotent (`rm -rf /opt/node`
  then `ln -sf`). Temurin 17 is pinned the same way: the image's default JDK
  is 21 and React Native requires 17.

  AGP 8 writes a "Dependency metadata" APK signing block that `fdroid scanner`
  rejects. `prebuild` sets `dependenciesInfo.includeInApk = false` (and
  includeInBundle) so the APKs this recipe produces are clean. The same change
  lives in plugins/withoutDependencyMetadata.js for later tags.

  No prebuilt binaries are downloaded at install time. The tree has no
  install scripts, so `npm ci` only unpacks registry tarballs.
  @shopify/react-native-skia was dropped in favour of react-native-svg (MIT)
  because its postinstall fetched prebuilt Skia libraries from GitHub
  Releases. Please do not accept a version that reintroduces it.

  `scripts/purge-nonfree-blobs.sh` then deletes unused prebuilts so the build
  has to succeed without them: hermes-compiler win64/macOS (win64 also has
  msvcp140.dll), every fb-dotslash binary, iOS packs under
  react-native/React/I18n, expo/template.tgz, Expo local-maven-repo .aars
  (unused because expo.autolinking.android.buildFromSource is ".*"),
  dependency gradle-wrapper.jars, and lightningcss. What remains is the
  scanignore list: Linux hermesc (permitted, actually run) and six .gradle
  files that declare a maven repo by local path. `fdroid scanner` exits 0.

  The scan logs a warning on Fontisto.ttf ("possibly code"); it is a mode-644
  TrueType font. The Android JS bundle is identical with the deleted files
  present; native code in the APK is compiled from source.

  The released APK requests no Android permission. The only uses-permission
  is com.kidsdoodle.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION, generated
  by AndroidX core with protectionLevel="signature". INTERNET is debug-only
  for Metro; ACCESS_NETWORK_STATE is stripped from release by
  plugins/withOfflineReleaseManifest.js.

  No analytics, advertising, crash reporting, Play Services or proprietary
  dependency. Runtime deps are MIT, Apache-2.0, BSD or ISC. expo-updates is
  not a dependency; plugins/withoutUpdatesMetadata.js strips the template
  meta-data. Hermes is the official prebuilt, as permitted.

