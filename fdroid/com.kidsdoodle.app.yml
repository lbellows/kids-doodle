# F-Droid build recipe for KidsDoodle.
#
# This file is not used by this repository — it is the metadata to submit to
# https://gitlab.com/fdroid/fdroiddata as metadata/com.kidsdoodle.app.yml.
# It is kept here so the recipe is versioned alongside the code it builds.
# See docs/PACKAGING.md for the submission procedure.

Categories:
  - Draw
  - Graphics
License: MIT
AuthorName: LB
SourceCode: https://github.com/lbellows/kids-doodle
IssueTracker: https://github.com/lbellows/kids-doodle/issues
Changelog: https://github.com/lbellows/kids-doodle/releases

AutoName: KidsDoodle

RepoType: git
Repo: https://github.com/lbellows/kids-doodle.git

Builds:
  # One build per architecture. The Gradle build splits the APK by ABI, and
  # `reactNativeArchitectures` narrows each run to a single one so every build
  # here produces exactly one APK. Each APK's versionCode is
  # `expo.android.versionCode * 10 + <abi offset>` (armeabi-v7a 1, arm64-v8a 2,
  # x86_64 3), assigned in plugins/withAbiSplits.js.
  - versionName: 1.0.3
    versionCode: 41
    commit: v1.0.3
    subdir: android/app
    gradleprops:
      - reactNativeArchitectures=armeabi-v7a
    sudo:
      # Node.js official binaries are a permitted prebuilt source.
      - curl -Lo node.tar.xz https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz
      - echo "d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307  node.tar.xz" | sha256sum -c -
      - tar xf node.tar.xz --directory=/opt
      - mv /opt/node-v22.23.2-linux-x64 /opt/node
      - ln -s /opt/node/bin/node /opt/node/bin/npm /opt/node/bin/npx /usr/local/bin/
    init:
      # fdroidserver joins these with "; " into a single bash invocation whose
      # working directory is `subdir` above, not the repository root. So cd up
      # once, here, and the rest run from the root. Keep the number of levels in
      # step with `subdir`.
      - cd ../..
      - npm ci
      # Deletes every prebuilt binary in node_modules that this build does not
      # use, so the Gradle build has to succeed without them. See the notes below.
      - ./scripts/purge-nonfree-blobs.sh
    gradle:
      - yes
    rm:
      - .github
    scanignore:
      # Everything the scanner would otherwise flag is deleted by
      # scripts/purge-nonfree-blobs.sh in the init step above. These are the
      # exceptions, and each is here for a stated reason rather than to quiet
      # the scanner:
      #
      # The Linux Hermes compiler. The Gradle build runs it to compile the
      # JavaScript bundle to bytecode, and Hermes is on F-Droid's list of
      # permitted prebuilts. Its Windows and macOS counterparts are deleted —
      # the Windows one also carries Microsoft's msvcp140.dll.
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      #
      # Six dependency .gradle files that declare a maven repository by local
      # path — "$rootDir/../node_modules/react-native/android", mavenLocal(),
      # and similar. The scanner reads them as unknown remote repositories. They
      # resolve to directories inside this checkout, so nothing is fetched from
      # an unvetted host.
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
    ndk: r27b

  - versionName: 1.0.3
    versionCode: 42
    commit: v1.0.3
    subdir: android/app
