MaintainerNotes: |-
  Expo (React Native) app. The native android/ project is committed to the
  repository and regenerated with `npx expo prebuild`; CI fails the build if it
  drifts from app.json, so the checked-in project always matches the config.

  android/gradle.properties already sets -Xmx4g -XX:MaxMetaspaceSize=1g. The
  Expo template's 512m metaspace is not enough once buildFromSource makes the
  Kotlin compiler build every Expo module from source in one daemon, so no
  memory tuning is needed in this recipe.

  Every release has three builds, one per ABI. A universal APK was 94 MB, of
  which 72 MB was four architectures' native libraries and only one is ever
  used on a device. VercodeOperation reproduces the versionCode scheme, so the
  auto-updater copies all three entries on a new tag and gives each the right
  code — the build blocks are ordered to match the operations, ascending.

  Release builds also run R8 (android.enableMinifyInReleaseBuilds=true) and
  store the native libraries compressed (expo.useLegacyPackaging=true). The keep
  rules live in android/app/proguard-rules.pro; upstream CI installs the
  minified APK on an emulator and fails the release if the app does not render.

  `gradle assembleRelease` produces a debug-signed APK here: the release signing
  config activates only when a keystore is supplied via environment variables,
  which the upstream GitHub Actions release build does and this build does not.
  Only the standard public Android debug key is committed to the repository.

  No prebuilt binaries are downloaded at install time. The dependency tree has
  zero preinstall/install/postinstall scripts, so `npm ci` only unpacks registry
  tarballs. @shopify/react-native-skia was deliberately dropped in favour of
  react-native-svg (MIT, pure Java) precisely because its postinstall fetched
  prebuilt Skia static libraries from GitHub Releases. Please do not accept a
  future version that reintroduces it.

  `npm ci` still unpacks prebuilt binaries that npm packages carry for other
  platforms. Wherever one is not needed, scripts/purge-nonfree-blobs.sh deletes
  it in the init step rather than asking you to take it on trust, and the build
  then has to succeed without it:

    * hermes-compiler's win64 and macOS compilers. The win64 directory also
      contains Microsoft's msvcp140.dll and ICU DLLs, which are not free
      software.
    * every fb-dotslash binary, Linux included. dotslash launches the React
      Native DevTools shell, which no release build touches.
    * the iOS localisation packs under react-native/React/I18n. Android builds
      from ReactAndroid; React/ is the Objective-C implementation.
    * Expo's app-scaffolding template archive, node_modules/expo/template.tgz.
    * Expo's precompiled .aar modules under node_modules/*/local-maven-repo.
      These are already unused because package.json sets
      expo.autolinking.android.buildFromSource to ".*", which makes every Expo
      module compile from Java/Kotlin source; deleting them proves it.
    * gradle-wrapper.jar inside dependency packages. Nothing uses them: this
      build removes android/gradlew and its wrapper jar too, and runs the
      buildserver's own gradle.
    * the lightningcss native module, used only by Metro's web CSS pipeline.

  What is left is the scanignore list above: the Linux hermesc, which the build
  genuinely runs and which F-Droid permits, and six dependency .gradle files
  that declare a maven repository by local path. `fdroid scanner` reports no
  other problems and exits 0 against the tagged source.

  The scan does log one warning, "Found executable binary, possibly code", for
  node_modules/@expo/vector-icons/.../Fonts/Fontisto.ttf. That file is an
  ordinary TrueType font with mode 644 — `file` reports "TrueType Font data" —
  so the heuristic is misreading it. It is a warning rather than a problem and
  the scan still passes, which is why it is not in the scanignore list above.

  The Android JS bundle is byte-for-byte identical to one built with all of the
  deleted files present. Every architecture's native code in the APK is compiled
  from source during the Gradle build.

  The released APK requests no Android permission at all. The only
  uses-permission entry is com.kidsdoodle.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION,
  which AndroidX core generates, namespaced to the app's own package with
  protectionLevel="signature"; it is app-private, grants nothing to any other
  app, is not surfaced to users, and is required by
  ContextCompat.registerReceiver. VIBRATE backed a buzz on a wrong PIN and was
  dropped in 1.0.2; the shake animation that always accompanied it remains.
  There are no network permissions: INTERNET is declared only in debug builds so
  the device can reach the Metro dev server, and ACCESS_NETWORK_STATE is
  contributed by React Native core's library manifest for a networking stack
  this app never uses. A release-only manifest overlay
  (plugins/withOfflineReleaseManifest.js) removes both, and CI fails the build
  if the released APK's permission set is anything other than that single
  app-private entry.

  There is no analytics, advertising or crash reporting, and no Google Play
  Services or other proprietary dependency. Every runtime dependency is MIT,
  Apache-2.0, BSD or ISC licensed.

  expo-updates is deliberately not a dependency, so there is no over-the-air
  code delivery: the JavaScript bundle is compiled into the APK at build time
  and cannot be replaced after installation. The manifest meta-data that the
  Expo template emits for expo-updates is stripped by a config plugin
  (plugins/withoutUpdatesMetadata.js) so the manifest does not imply otherwise.

  Hermes is enabled and consumed as an official prebuilt, as permitted.

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
VercodeOperation:
